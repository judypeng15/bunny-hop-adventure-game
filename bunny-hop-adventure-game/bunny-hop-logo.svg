<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Bunny Hop Adventure logo</title>
  <desc id="desc">A polished pink storybook logo with an illustrated bunny, florals, and the words Bunny Hop Adventure.</desc>
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb9d5"/><stop offset=".48" stop-color="#f36da6"/><stop offset="1" stop-color="#c93e7b"/></linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb6d1"/><stop offset="1" stop-color="#eb6f9f"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b5"/><stop offset=".5" stop-color="#e3b85d"/><stop offset="1" stop-color="#bb8438"/></linearGradient>
    <radialGradient id="face" cx="38%" cy="29%"><stop stop-color="#fffdfc"/><stop offset="1" stop-color="#f9e8ed"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#8d315b" flood-opacity=".23"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#f4b9ce" opacity=".32"/></pattern>
  </defs>
