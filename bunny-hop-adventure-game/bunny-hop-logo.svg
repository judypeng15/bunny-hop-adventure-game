  <path d="M500 55 C530 54 548 73 573 79 C603 87 626 70 652 81 C679 92 683 119 706 134 C729 149 757 143 775 164 C793 185 783 210 799 233 C815 256 843 264 849 292 C855 320 834 341 838 368 C842 397 864 418 855 444 C846 471 816 480 803 504 C789 530 793 557 769 572 C746 588 718 575 692 585 C666 595 651 619 623 617 C595 616 579 592 552 588 C525 584 500 599 474 588 C448 577 439 549 414 537 C389 525 360 534 339 517 C318 499 322 470 304 449 C286 428 257 420 251 393 C245 366 266 344 262 317 C258 290 236 269 245 243 C254 217 284 208 298 185 C312 162 309 134 331 116 C353 98 381 109 407 99 C433 89 449 67 476 68 C486 68 493 72 500 55Z" transform="translate(0,-13)" fill="url(#dots)" stroke="#f4a6c3" stroke-width="2.5"/>
  <!-- filigree side flourishes -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round">
    <path d="M290 290 C250 250 276 224 309 239 C331 249 330 268 317 277 C305 285 291 276 296 265"/><path d="M710 290 C750 250 724 224 691 239 C669 249 670 268 683 277 C695 285 709 276 704 265"/>
