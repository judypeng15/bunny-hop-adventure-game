    <circle cx="551" cy="212" r="5" fill="url(#gold)" stroke="#fff5d5" stroke-width="1.5"/>
    <!-- body/paws -->
    <path d="M451 294 Q500 270 549 294 L569 353 Q500 374 431 353Z" fill="url(#face)" stroke="#d985a5" stroke-width="4"/>
    <ellipse cx="464" cy="353" rx="28" ry="13" fill="#fffafc" stroke="#d985a5" stroke-width="3"/>
    <ellipse cx="536" cy="353" rx="28" ry="13" fill="#fffafc" stroke="#d985a5" stroke-width="3"/>
    <ellipse cx="500" cy="326" rx="23" ry="26" fill="#fff" opacity=".75"/>
  </g>
  <!-- floral garland at the bunny's feet -->
  <path d="M405 370 Q455 390 500 377 Q547 392 595 370" fill="none" stroke="#6f9c70" stroke-width="4" stroke-linecap="round"/>
  <g fill="#79ae7a"><path d="M435 380 Q413 363 418 355 Q437 357 442 375Z"/><path d="M465 383 Q449 398 440 391 Q445 376 462 377Z"/><path d="M555 383 Q575 398 584 391 Q579 376 558 377Z"/><path d="M580 379 Q601 362 596 354 Q577 357 573 375Z"/></g>
  <g fill="#f397b9" stroke="#fff7fa" stroke-width="2"><circle cx="426" cy="368" r="8"/><circle cx="453" cy="386" r="7"/><circle cx="547" cy="386" r="7"/><circle cx="585" cy="367" r="8"/></g>
  <g fill="url(#gold)"><circle cx="426" cy="368" r="2.8"/><circle cx="453" cy="386" r="2.5"/><circle cx="547" cy="386" r="2.5"/><circle cx="585" cy="367" r="2.8"/></g>
  <!-- custom-styled wordmark -->
  <text x="500" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-weight="bold" font-style="italic" letter-spacing="1" fill="#fff" stroke="#fff" stroke-width="13" stroke-linejoin="round">Bunny Hop</text>
  <text x="500" y="446" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-weight="bold" font-style="italic" letter-spacing="1" fill="url(#pink)" stroke="#a83768" stroke-width="1.5" paint-order="stroke">Bunny Hop</text>
  <path d="M327 465 Q500 482 673 465" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M355 472 Q500 486 645 472" fill="none" stroke="#f0a1bd" stroke-width="1.5"/>
  <text x="500" y="512" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" letter-spacing="9" fill="#9d4d6d">A D V E N T U R E</text>
  <!-- decorative stars, diamonds, and tiny leaves -->
  <g fill="url(#gold)" stroke="#fff4d5" stroke-width="1">
    <path d="M365 291 L371 309 L389 315 L371 321 L365 339 L359 321 L341 315 L359 309Z"/><path d="M635 291 L641 309 L659 315 L641 321 L635 339 L629 321 L611 315 L629 309Z"/>
    <path d="M393 124 L397 135 L408 139 L397 143 L393 154 L389 143 L378 139 L389 135Z"/><path d="M607 124 L611 135 L622 139 L611 143 L607 154 L603 143 L592 139 L603 135Z"/>
    <path d="M316 421 L320 432 L331 436 L320 440 L316 451 L312 440 L301 436 L312 432Z"/><path d="M684 421 L688 432 L699 436 L688 440 L684 451 L680 440 L669 436 L680 432Z"/>
  </g>
